<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BuscaIA — Busca, pregunta, aprende</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #17171d;
      --surface-2: #1f1f28;
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.16);
      --accent: #7c6af7;
      --accent-glow: rgba(124,106,247,0.18);
      --accent-light: #a99cf9;
      --text: #f0eff8;
      --text-muted: #8f8ea8;
      --text-faint: #4e4d62;
      --danger: #f87171;
      --font-display: 'Sora', sans-serif;
      --font-body: 'Inter', sans-serif;
      --radius: 12px;
      --radius-sm: 8px;
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: rgba(15,15,19,0.9);
      backdrop-filter: blur(12px);
      z-index: 100;
    }

    .logo {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-badge {
      font-size: 12px;
      color: var(--text-muted);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 4px 12px;
    }

    #btn-limpiar {
      font-size: 12px;
      color: var(--text-faint);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 4px 12px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      display: none;
    }

    #btn-limpiar:hover { color: var(--danger); border-color: var(--danger); }

    /* HERO */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 4rem 1.5rem 2.5rem;
    }

    .hero-eyebrow {
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent-light);
      margin-bottom: 1rem;
      font-weight: 500;
    }

    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 700;
      line-height: 1.15;
      color: var(--text);
      margin-bottom: 1rem;
      max-width: 600px;
    }

    .hero-title span { color: var(--accent-light); }

    .hero-sub {
      font-size: 15px;
      color: var(--text-muted);
      max-width: 440px;
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    /* SEARCH */
    .search-wrapper { width: 100%; max-width: 640px; }

    .search-bar {
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border-hover);
      border-radius: var(--radius);
      padding: 4px 4px 4px 16px;
      gap: 8px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-bar:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-icon { color: var(--text-faint); flex-shrink: 0; }

    #query {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      padding: 10px 0;
    }

    #query::placeholder { color: var(--text-faint); }

    #btn-buscar {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      font-family: var(--font-body);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.15s, transform 0.15s;
      white-space: nowrap;
    }

    #btn-buscar:hover { opacity: 0.9; }
    #btn-buscar:active { transform: scale(0.97); }
    #btn-buscar:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 1rem;
    }

    .suggestion-pill {
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    .suggestion-pill:hover {
      border-color: var(--accent);
      color: var(--accent-light);
      background: var(--accent-glow);
    }

    /* CHAT */
    main {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 0 1.5rem 2rem;
      flex: 1;
    }

    #chat-container {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .msg-user {
      display: flex;
      justify-content: flex-end;
    }

    .msg-user-bubble {
      background: var(--accent);
      color: #fff;
      border-radius: 16px 16px 4px 16px;
      padding: 10px 16px;
      max-width: 80%;
      font-size: 15px;
      line-height: 1.5;
    }

    .msg-ia {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .msg-ia-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--accent-glow);
      border: 1px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .msg-ia-avatar-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    .msg-ia-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px 16px 16px 16px;
      padding: 12px 16px;
      max-width: 88%;
      font-size: 15px;
      line-height: 1.75;
      color: var(--text);
      white-space: pre-wrap;
    }

    .msg-typing {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 14px 16px;
    }

    .typing-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--text-faint);
      animation: bounce 1.2s infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-5px); opacity: 1; }
    }

    /* INPUT BOTTOM */
    .input-area {
      position: sticky;
      bottom: 0;
      background: rgba(15,15,19,0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 1rem 1.5rem;
    }

    .input-inner {
      max-width: 720px;
      margin: 0 auto;
    }

    .input-bar {
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border-hover);
      border-radius: var(--radius);
      padding: 4px 4px 4px 16px;
      gap: 8px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-bar:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    #query2 {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      padding: 10px 0;
    }

    #query2::placeholder { color: var(--text-faint); }

    #btn-enviar {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.15s, transform 0.15s;
    }

    #btn-enviar:hover { opacity: 0.9; }
    #btn-enviar:active { transform: scale(0.97); }
    #btn-enviar:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    #error-box {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 0.75rem 1rem;
      background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.2);
      border-radius: var(--radius-sm);
      color: var(--danger);
      font-size: 13px;
      margin-top: 0.75rem;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--text-faint);
      font-size: 12px;
      border-top: 1px solid var(--border);
    }

    /* ESTADOS */
    #hero-section { display: flex; flex-direction: column; align-items: center; }
    #chat-section { display: none; }

    @media (max-width: 520px) {
      header { padding: 1rem; }
      .hero { padding: 2.5rem 1rem 1.5rem; }
      #btn-buscar span { display: none; }
      .input-area { padding: 0.75rem 1rem; }
    }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="/" onclick="reiniciar(event)">
      <span class="logo-dot"></span>
      BuscaIA
    </a>
    <div class="header-right">
      <button id="btn-limpiar" onclick="reiniciar()">Nueva conversación</button>
      <span class="header-badge">Búsqueda con IA</span>
    </div>
  </header>

  <!-- HERO (pantalla inicial) -->
  <div id="hero-section">
    <section class="hero">
      <p class="hero-eyebrow">Inteligencia artificial en tiempo real</p>
      <h1 class="hero-title">Pregunta cualquier cosa,<br><span>obtén respuestas reales</span></h1>
      <p class="hero-sub">BuscaIA usa IA para darte respuestas claras y precisas. Puedes hacer preguntas de seguimiento en la misma conversación.</p>

      <div class="search-wrapper">
        <div class="search-bar">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="query" placeholder="¿Qué quieres saber hoy?" autocomplete="off" />
          <button id="btn-buscar" onclick="iniciarChat()">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            <span>Buscar</span>
          </button>
        </div>
      </div>

      <div class="suggestions" id="suggestions"></div>
    </section>
  </div>

  <!-- CHAT (después de la primera pregunta) -->
  <div id="chat-section">
    <main>
      <div id="chat-container"></div>
    </main>
  </div>

  <!-- INPUT FIJO (aparece durante el chat) -->
  <div class="input-area" id="input-area" style="display:none;">
    <div class="input-inner">
      <div class="input-bar">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="query2" placeholder="Pregunta algo más..." autocomplete="off" />
        <button id="btn-enviar" onclick="enviarMensaje()">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </div>
      <div id="error-box">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="error-text"></span>
      </div>
    </div>
  </div>

  <footer>
    BuscaIA &mdash; Powered by Groq AI
  </footer>

  <script>
    const SUGGESTIONS = [
      "¿Qué es la fotosíntesis?",
      "¿Cómo funciona un agujero negro?",
      "¿Qué es el ADN?",
      "¿Cómo se forma el arcoíris?",
      "¿Qué es la inflación?",
    ];

    // Historial de mensajes para la API
    let historial = [];

    const suggestionsEl = document.getElementById('suggestions');
    SUGGESTIONS.forEach(q => {
      const pill = document.createElement('button');
      pill.className = 'suggestion-pill';
      pill.textContent = q;
      pill.addEventListener('click', () => {
        document.getElementById('query').value = q;
        iniciarChat();
      });
      suggestionsEl.appendChild(pill);
    });

    document.getElementById('query').addEventListener('keydown', e => {
      if (e.key === 'Enter') iniciarChat();
    });

    document.getElementById('query2').addEventListener('keydown', e => {
      if (e.key === 'Enter') enviarMensaje();
    });

    function iniciarChat() {
      const query = document.getElementById('query').value.trim();
      if (!query) return;

      // Cambiar de vista hero a chat
      document.getElementById('hero-section').style.display = 'none';
      document.getElementById('chat-section').style.display = 'block';
      document.getElementById('input-area').style.display = 'block';
      document.getElementById('btn-limpiar').style.display = 'block';

      enviarQuery(query);
    }

    function enviarMensaje() {
      const query = document.getElementById('query2').value.trim();
      if (!query) return;
      document.getElementById('query2').value = '';
      enviarQuery(query);
    }

    function reiniciar(e) {
      if (e) e.preventDefault();
      historial = [];
      document.getElementById('chat-container').innerHTML = '';
      document.getElementById('hero-section').style.display = 'flex';
      document.getElementById('chat-section').style.display = 'none';
      document.getElementById('input-area').style.display = 'none';
      document.getElementById('btn-limpiar').style.display = 'none';
      document.getElementById('query').value = '';
      document.getElementById('error-box').style.display = 'none';
    }

    function agregarMensajeUsuario(texto) {
      const chat = document.getElementById('chat-container');
      const div = document.createElement('div');
      div.className = 'msg-user';
      div.innerHTML = `<div class="msg-user-bubble">${escapeHtml(texto)}</div>`;
      chat.appendChild(div);
      div.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    function agregarTyping() {
      const chat = document.getElementById('chat-container');
      const div = document.createElement('div');
      div.className = 'msg-ia';
      div.id = 'typing-indicator';
      div.innerHTML = `
        <div class="msg-ia-avatar"><span class="msg-ia-avatar-dot"></span></div>
        <div class="msg-ia-bubble msg-typing">
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
        </div>`;
      chat.appendChild(div);
      div.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    function quitarTyping() {
      const el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    function agregarRespuestaIA(texto) {
      const chat = document.getElementById('chat-container');
      const div = document.createElement('div');
      div.className = 'msg-ia';
      div.innerHTML = `
        <div class="msg-ia-avatar"><span class="msg-ia-avatar-dot"></span></div>
        <div class="msg-ia-bubble">${escapeHtml(texto)}</div>`;
      chat.appendChild(div);
      div.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function enviarQuery(query) {
      const btnEnviar = document.getElementById('btn-enviar');
      const btnBuscar = document.getElementById('btn-buscar');
      btnEnviar.disabled = true;
      btnBuscar.disabled = true;
      document.getElementById('error-box').style.display = 'none';

      agregarMensajeUsuario(query);
      agregarTyping();

      // Agregar al historial
      historial.push({ role: 'user', content: query });

      try {
        const response = await fetch('/api/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ historial })
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.error || `Error ${response.status}`);
        }

        const data = await response.json();
        quitarTyping();
        agregarRespuestaIA(data.answer);

        // Guardar respuesta en el historial
        historial.push({ role: 'assistant', content: data.answer });

      } catch (err) {
        quitarTyping();
        historial.pop(); // quitar el mensaje que falló
        document.getElementById('error-box').style.display = 'flex';
        document.getElementById('error-text').textContent = err.message || 'Error inesperado. Intenta de nuevo.';
      }

      btnEnviar.disabled = false;
      btnBuscar.disabled = false;
      document.getElementById('query2').focus();
    }
  </script>

</body>
</html>
